name: Rakuten Affiliate Pool Refill

on:
  schedule:
    # 毎日 21:00 JST = 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true にするとpool.jsonを更新せず内容確認のみ行う"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run poster
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: npm start

      - name: Commit updated pool and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/history.json docs/pool.json
          git diff --staged --quiet || git commit -m "chore: update post pool [skip ci]"
          git push
